services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: marvelsdb
      DATABASE_USER: root
      DATABASE_PASSWORD: marvelsdb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: marvelsdb
      MYSQL_DATABASE: marvelsdb
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmarvelsdb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
